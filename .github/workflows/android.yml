name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: day-board-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Runs the app on an emulator and drives the main flows (BoardFlowTest).
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -G 16M || true
            ./gradlew --no-daemon connectedDebugAndroidTest; status=$?; adb logcat -d -s DayBoardShot:I > shots.log; exit $status
      - name: Collect screenshots
        if: always()
        run: python3 .github/scripts/split_shots.py shots.log shots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens
          path: shots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/

  # Prints each screenshot as base64 in its own small log, so it can be
  # reviewed without downloading artifacts.
  ui-screens:
    needs: ui-test
    if: always() && needs.ui-test.result != 'skipped'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shot: [01-empty-board, 02-add-form, 03-board-with-event, 04-event-sheet, 05-sample-event-sheet, 06-settings, 07-lines]
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ui-screens
          path: shots
      - name: Print ${{ matrix.shot }}
        run: |
          if [ -f "shots/${{ matrix.shot }}.b64" ]; then
            echo "BEGIN-SHOT"; fold -w 3000 "shots/${{ matrix.shot }}.b64"; echo; echo "END-SHOT"
          else
            echo "No screenshot named ${{ matrix.shot }}"
          fi
